<style>
:root{
  --bg:#EEF1EC; --card:#FFFFFF; --ink:#13201C; --muted:#5B6862; --line:#D5DCD5;
  --accent:#2B45F5; --on-accent:#FFFFFF; --pop:#FFD84D; --on-pop:#13201C;
  --r:20px; --shadow:0 8px 32px rgba(19,32,28,.08);
  --ease:cubic-bezier(.22,1,.36,1);
  --android:cubic-bezier(.4,0,.2,1);
  --android-decel:cubic-bezier(0,0,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1714;--card:#18231F;--ink:#EAF0EC;--muted:#9AA9A2;--line:#2A3833;--accent:#7C8CFF;--on-accent:#0F1714;--shadow:0 8px 32px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#0F1714;--card:#18231F;--ink:#EAF0EC;--muted:#9AA9A2;--line:#2A3833;--accent:#7C8CFF;--on-accent:#0F1714;--shadow:0 8px 32px rgba(0,0,0,.4)}
:root[data-theme="light"]{--bg:#EEF1EC;--card:#FFFFFF;--ink:#13201C;--muted:#5B6862;--line:#D5DCD5;--accent:#2B45F5;--on-accent:#FFFFFF;--shadow:0 8px 32px rgba(19,32,28,.08)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;transition:background .4s var(--ease),color .4s var(--ease);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(45,185,100,.35)}50%{box-shadow:0 0 0 8px rgba(45,185,100,0)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes iconBounce{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.25) rotate(-12deg)}50%{transform:scale(.9) rotate(8deg)}75%{transform:scale(1.15) rotate(-5deg)}}
@keyframes iconSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes explode{0%{transform:scale(1);opacity:1;filter:blur(0)}30%{transform:scale(1.8);opacity:.9;filter:blur(1px)}100%{transform:scale(4.5);opacity:0;filter:blur(6px)}}
@keyframes particle{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
@keyframes borderFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes borderPulse{
  0%,100%{opacity:.85;filter:brightness(1)}
  50%{opacity:1;filter:brightness(1.25)}
}

.top{max-width:1100px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:flex-end;gap:12px;animation:fadeUp .6s var(--ease) both}
.controls{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.lang button{font:600 13px Manrope,sans-serif;border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer;transition:all .25s var(--ease)}
.lang button:hover{color:var(--ink);transform:scale(1.08)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);transform:scale(1.05)}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:all .3s var(--ease)}
.theme:hover{background:var(--ink);color:var(--bg);transform:rotate(20deg) scale(1.1)}
.theme svg{width:18px;height:18px;transition:transform .4s var(--ease)}

.page{max-width:1100px;margin:0 auto;padding:8px 20px 40px;display:grid;gap:28px;perspective:1200px}
.profile{text-align:center;animation:fadeUp .7s var(--ease) .1s both}
.avatar{width:112px;height:112px;border-radius:50%;margin:8px auto 18px;background-color:var(--line);background-size:cover;background-position:center;border:4px solid var(--card);box-shadow:0 0 0 2px var(--ink),var(--shadow);display:block;transition:transform .4s var(--ease),opacity .4s;animation:float 4s ease-in-out infinite,skelPulse 1.4s ease-in-out infinite;position:relative;overflow:hidden}
.avatar.loaded{background-image:url('pfp.jpg');animation:float 4s ease-in-out infinite;opacity:1}
.avatar:hover{transform:scale(1.06) rotate(3deg)}
@keyframes skelPulse{0%,100%{opacity:.55}50%{opacity:.9}}
h1{font:700 28px/1.15 Unbounded,sans-serif;margin:0 0 8px;letter-spacing:-.02em;transition:transform .3s var(--ease)}
.profile:hover h1{transform:translateY(-2px)}
.bio{color:var(--muted);margin:0 auto;max-width:36ch;font-size:15px;opacity:0;animation:fadeUp .6s var(--ease) .25s forwards}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:fadeUp .6s var(--ease) .3s both}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#2DB964;animation:pulseGlow 2s ease-in-out infinite}
.socials{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;animation:fadeUp .6s var(--ease) .35s both}
.socials a{display:flex;align-items:center;gap:8px;padding:0 20px;height:46px;border-radius:40px;border:1.5px solid var(--ink);font:700 13px Unbounded,sans-serif;transition:all .3s var(--ease);transform-style:preserve-3d}
.socials a svg{width:18px;height:18px;flex-shrink:0;transition:transform .4s var(--ease)}
.socials a:hover{background:var(--ink);color:var(--bg);transform:translateY(-4px) rotateX(8deg) scale(1.04);box-shadow:0 12px 28px rgba(19,32,28,.18)}
.socials a:hover svg{animation:iconBounce .6s var(--ease)}

.links{display:grid;gap:14px;animation:fadeUp .7s var(--ease) .2s both}
.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;min-height:72px;box-shadow:var(--shadow);transition:all .35s var(--ease);transform-style:preserve-3d;position:relative;overflow:hidden;cursor:pointer}
.link::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);background-size:200% 100%;opacity:0;transition:opacity .3s;pointer-events:none}
.link:hover::before{opacity:1;animation:shimmer 1.2s linear}
.link:hover{transform:translateY(-6px) rotateX(4deg) scale(1.02);border-color:var(--ink);box-shadow:0 16px 40px rgba(19,32,28,.14)}
.badge{flex:none;width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;transition:transform .35s var(--ease),background .3s;position:relative;z-index:2}
.badge svg{width:22px;height:22px;transition:transform .4s var(--ease)}
.link:hover .badge{transform:rotateY(18deg) scale(1.08)}
.link:hover .badge svg{animation:iconSpin .7s var(--ease)}
.link b{display:block;font-weight:700}
.link small{color:var(--muted);font-size:13.5px}
.link .arrow{margin-left:auto;flex:none;opacity:.4;transition:all .3s var(--ease)}
.link:hover .arrow{opacity:1;transform:translate(4px,-4px) scale(1.1)}
.link.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:24px;min-height:108px}
.link.main .badge{background:var(--pop);color:var(--on-pop)}
.link.main small{color:inherit;opacity:.85}
.link.main b{font:700 18px/1.2 Unbounded,sans-serif}
.link.main:hover{box-shadow:0 18px 48px rgba(43,69,245,.4);transform:translateY(-8px) rotateX(5deg) scale(1.03)}
.link.main:hover .badge{transform:rotateY(25deg) scale(1.12)}

.link.glowing{
  pointer-events:none;
  border:2px solid transparent!important;
  background-clip:padding-box;
  position:relative;
  z-index:5;
}
.link.glowing::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:calc(var(--r) + 3px);
  background:linear-gradient(90deg,#8B8B9E,#A78BFA,#C4B5FD,#8B8B9E,#7C3AED,#A78BFA,#8B8B9E);
  background-size:300% 100%;
  animation:borderFlow 1.4s linear infinite,borderPulse 1s ease-in-out infinite;
  z-index:-1;
  filter:blur(.5px);
}
.link.main.glowing::after{
  background:linear-gradient(90deg,#8B8B9E,#A78BFA,#C4B5FD,#8B8B9E,#7C3AED,#A78BFA,#8B8B9E);
  background-size:300% 100%;
}
.link.exploding .badge{animation:explode 1.2s var(--android-decel) forwards;z-index:10}
.link.exploding .badge svg{animation:none}

.particle{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:10000;animation:particle 1.1s var(--android-decel) forwards}

footer{max-width:1100px;margin:0 auto;padding:12px 20px 36px;text-align:center;color:var(--muted);font-size:13px;animation:fadeUp .6s var(--ease) .45s both;user-select:none;-webkit-user-select:none;pointer-events:none}
[data-t] .w{display:inline-block;transition:filter .2s ease,opacity .2s ease}
[data-t] .w.blur{filter:blur(6px);opacity:.3}
footer .credit{font-weight:700;color:var(--ink);letter-spacing:.02em}
footer .credit .nick{filter:blur(4.5px);-webkit-filter:blur(4.5px);user-select:none;-webkit-user-select:none}
footer .note{display:block;margin-top:6px;font-size:11px;opacity:.7;font-weight:400}

@media (min-width:900px){
  .top{padding:24px 32px}
  .page{grid-template-columns:360px 1fr;gap:56px;padding:32px 32px 64px;align-items:start}
  .profile{position:sticky;top:24px;text-align:left}
  .avatar{margin-left:0}
  h1{font-size:36px}
  .bio{margin:0}
  .socials{justify-content:flex-start}
  .links{grid-template-columns:1fr 1fr;gap:18px}
  .link.main{grid-column:1/-1;min-height:156px;padding:32px}
  .link.main b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bg3d{display:none!important}
}
.bg3d{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.5}
.bg3d .shape{position:absolute;border:1.5px solid var(--accent);opacity:.35;transform-style:preserve-3d;will-change:transform}
.bg3d .s1{width:70px;height:70px;top:12%;left:8%;border-radius:16px;animation:spin3d 18s linear infinite,floatY 7s ease-in-out infinite}
.bg3d .s2{width:50px;height:50px;top:55%;left:78%;border-radius:50%;animation:spin3d 14s linear infinite reverse,floatY 9s ease-in-out infinite .5s;opacity:.25}
.bg3d .s3{width:90px;height:90px;top:70%;left:12%;border-radius:20px;animation:spin3d 22s linear infinite,floatY 8s ease-in-out infinite 1s;opacity:.2;border-style:dashed}
.bg3d .s4{width:40px;height:40px;top:20%;left:70%;border-radius:8px;animation:spin3d 11s linear infinite reverse,floatY 6s ease-in-out infinite .3s}
.bg3d .s5{width:60px;height:60px;top:40%;left:45%;border-radius:50%;border-width:2px;animation:spin3d 16s linear infinite,floatY 10s ease-in-out infinite 1.5s;opacity:.18}
.bg3d .s6{width:55px;height:55px;top:8%;left:40%;clip-path:polygon(50% 0%,100% 100%,0% 100%);border:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);animation:spin3d 13s linear infinite reverse,floatY 7.5s ease-in-out infinite .8s;opacity:.3}
.bg3d .s7{width:45px;height:45px;top:75%;left:55%;border-radius:12px;animation:spin3d 20s linear infinite,floatY 8.5s ease-in-out infinite 2s;opacity:.22}
@keyframes spin3d{0%{transform:rotateX(0) rotateY(0) rotateZ(0)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg)}}
@keyframes floatY{0%,100%{translate:0 0}50%{translate:0 -18px}}
body > *:not(.bg3d){position:relative;z-index:1}
</style>

var langBusy=false;
function wrapWords(el,text){
  el.innerHTML='';
  if(!text)return;
  var parts=String(text).split(/(\s+)/);
  parts.forEach(function(p){
    if(/^\s+$/.test(p)){el.appendChild(document.createTextNode(p));return}
    if(!p)return;
    var s=document.createElement('span');
    s.className='w';
    s.textContent=p;
    el.appendChild(s);
  });
}
function setLang(l,instant){
  if(langBusy&&!instant)return;
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l)});
  document.documentElement.lang=l;
  document.title='Nicksberg — '+(I18N[l]&&I18N[l].name||'nicksberg');
  try{localStorage.setItem('Nicksberg-lang',l)}catch(e){}

  var els=Array.prototype.slice.call(document.querySelectorAll('[data-t]'));
  if(instant||!els.length){
    els.forEach(function(el){wrapWords(el,(I18N[l]&&I18N[l][el.dataset.t])||'')});
    return;
  }
  langBusy=true;
  var words=[];
  els.forEach(function(el){
    Array.prototype.forEach.call(el.querySelectorAll('.w'),function(w){words.push(w)});
  });
  if(!words.length){
    els.forEach(function(el){wrapWords(el,(I18N[l]&&I18N[l][el.dataset.t])||'')});
    langBusy=false;
    return;
  }
  var i=0;
  function blurNext(){
    if(i>=words.length){
      els.forEach(function(el){wrapWords(el,(I18N[l]&&I18N[l][el.dataset.t])||'')});
      var nw=[];
      els.forEach(function(el){
        Array.prototype.forEach.call(el.querySelectorAll('.w'),function(w){
          w.classList.add('blur');
          nw.push(w);
        });
      });
      requestAnimationFrame(function(){
        var j=0;
        function clearNext(){
          if(j>=nw.length){langBusy=false;return}
          nw[j].classList.remove('blur');
          j++;
          setTimeout(clearNext,40);
        }
        setTimeout(clearNext,30);
      });
      return;
    }
    words[i].classList.add('blur');
    i++;
    setTimeout(blurNext,40);
  }
  blurNext();
}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.l)})});

var sun='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
var moon='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeIcon').innerHTML=t==='dark'?sun:moon;
  try{localStorage.setItem('Nicksberg-theme',t)}catch(e){}
}
document.getElementById('themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  setTheme(cur==='dark'?'light':'dark');
});

var isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
var animating=false;

function spawnParticles(x,y){
  var accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2B45F5';
  var pop=getComputedStyle(document.documentElement).getPropertyValue('--pop').trim()||'#FFD84D';
  for(var i=0;i<14;i++){
    var p=document.createElement('div');
    p.className='particle';
    var angle=Math.random()*Math.PI*2;
    var dist=40+Math.random()*110;
    p.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    p.style.left=x+'px';
    p.style.top=y+'px';
    p.style.background=i%2?accent:pop;
    var s=5+Math.random()*8;
    p.style.width=s+'px';
    p.style.height=s+'px';
    document.body.appendChild(p);
    setTimeout(function(el){el.remove()},1200);
  }
}

function playTap(el,href){
  if(animating)return;
  animating=true;
  try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}

  var badge=el.querySelector('.badge');
  if(badge){
    var r=badge.getBoundingClientRect();
    el.classList.add('exploding');
    spawnParticles(r.left+r.width/2,r.top+r.height/2);
  }

  el.classList.add('glowing');

  setTimeout(function(){
    window.location.href=href;
  },2000);
}

document.querySelectorAll('.link').forEach(function(el){
  var href=el.getAttribute('data-href')||el.href;

  if(!isTouch){
    el.addEventListener('mousemove',function(e){
      if(animating)return;
      var r=el.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-.5;
      var y=(e.clientY-r.top)/r.height-.5;
      el.style.transform='translateY(-6px) rotateX('+(-y*12)+'deg) rotateY('+(x*12)+'deg) scale(1.02)';
    });
    el.addEventListener('mouseleave',function(){if(!animating)el.style.transform=''});
  }

  el.addEventListener('click',function(e){
    e.preventDefault();
    if(isTouch){
      playTap(el,href);
    }else{
      window.location.href=href;
    }
  });
});

document.querySelectorAll('.social-link').forEach(function(el){
  var href=el.getAttribute('data-href')||el.href;
  el.addEventListener('click',function(e){
    if(isTouch){
      e.preventDefault();
      if(animating)return;
      animating=true;
      try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}
      var svg=el.querySelector('svg');
      if(svg){
        svg.style.animation='explode 1.2s var(--android-decel) forwards';
        var r=svg.getBoundingClientRect();
        spawnParticles(r.left+r.width/2,r.top+r.height/2);
      }
      el.style.transition='transform .9s var(--android-decel),opacity .9s var(--android-decel)';
      el.style.transform='scale(2.2)';
      el.style.opacity='0';
      setTimeout(function(){window.location.href=href},1100);
    }
  });
});

function resetAnimState(){
  animating=false;
  document.querySelectorAll('.link.glowing,.link.exploding').forEach(function(el){
    el.classList.remove('glowing','exploding');
    el.style.transform='';
  });
  document.querySelectorAll('.social-link').forEach(function(el){
    el.style.transform='';
    el.style.opacity='';
    var svg=el.querySelector('svg');
    if(svg)svg.style.animation='';
  });
  document.querySelectorAll('.particle').forEach(function(el){el.remove()});
}
window.addEventListener('pageshow',function(e){resetAnimState()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)resetAnimState()});

(function(){
  var av=document.querySelector('.avatar');
  if(!av)return;
  var img=new Image();
  img.onload=function(){av.classList.add('loaded')};
  img.onerror=function(){av.classList.add('loaded')};
  img.src='pfp.jpg';
})();

var startLang='ru';
try{startLang=localStorage.getItem('Nicksberg-lang')||((navigator.language||'ru').slice(0,2))}catch(e){}
setLang(I18N[startLang]?startLang:'ru',true);

var startTheme;
try{startTheme=localStorage.getItem('Nicksberg-theme')}catch(e){}
if(startTheme)setTheme(startTheme);
else if(matchMedia('(prefers-color-scheme:dark)').matches)setTheme('dark');
else setTheme('light');
</script>
